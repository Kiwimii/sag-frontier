# Deploy the validated Focused Interface 0.20 from the live branch
name: Deploy SAG Focused Interface 0.20

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated SAG Frontier production branch
        uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate production files and focused interface
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s launch.html
          test -s sprint13.html
          test -s sprint14.html
          test -s sprint19.html
          test -s sprint20.html
          test -s sprint20-focused.css
          test -s sprint20-visual-fixes.css
          for file in \
            sprint13-config.js \
            sprint13-source.js \
            sprint12-ui.js \
            sprint14-progression-core.js \
            sprint14-progression-advanced.js \
            sprint14-progression-ui.js \
            sprint14-progression-advanced-ui.js \
            sprint15-story-core.js \
            sprint15-cinematic.js \
            sprint16-lore-kiwimi.js \
            sprint17-campaign.js \
            sprint18-world-events.js \
            sprint19-finale.js \
            sprint20-focused.js \
            tests/sprint13-smoke.mjs \
            tests/sprint14-smoke.mjs \
            tests/sprint19-smoke.mjs \
            tests/sprint20-smoke.mjs; do
            test -s "$file"
            node --check "$file"
          done
          grep -q 'sprint20.html?build=0200' index.html
          grep -q 'Focused Interface 0.20' sprint20.html
          test -z "$(grep -o 'sag-frontier-reset-v020' sprint20.html || true)"
          node tests/sprint13-static.cjs
          node tests/sprint14-static.cjs
          node tests/sprint14-progression.cjs
          node tests/sprint19-static.cjs
          node tests/sprint19-story.cjs
          node tests/sprint20-static.cjs

      - name: Install Chromium for browser validation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run complete browser regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/sag20-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint13-smoke.mjs
          node tests/sprint14-smoke.mjs
          node tests/sprint19-smoke.mjs
          node tests/sprint20-smoke.mjs

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='site' \
            --exclude='sprint20-*.png' \
            ./ site/
          touch site/.nojekyll
          cat > site/build-info.json <<EOF
          {
            "release": "SAG Focused Interface 0.20",
            "source_branch": "live",
            "source_sha": "$(git rev-parse HEAD)",
            "deployed_from": "${GITHUB_SHA}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          test -s site/index.html
          test -s site/sprint13.html
          test -s site/sprint14.html
          test -s site/sprint19.html
          test -s site/sprint20.html
          test -s site/sprint20-focused.css
          test -s site/sprint20-visual-fixes.css
          test -s site/sprint20-focused.js
          test -s site/build-info.json

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy SAG Focused Interface 0.20 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
