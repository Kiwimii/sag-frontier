# Validation probe 3 for Command Progression 0.14
name: Deploy Command Progression 0.14 Browser Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Command Progression production branch
        uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Command Progression production files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s launch.html
          test -s sprint13.html
          test -s sprint13.bundle.css
          test -s sprint13-config.js
          test -s sprint13-source.js
          test -s sprint12-ui.js
          test -s sprint14.html
          test -s sprint14-progression-core.js
          test -s sprint14-progression-advanced.js
          test -s sprint14-progression-ui.js
          test -s sprint14-progression-advanced-ui.js
          test -s sprint14-progression.css
          test -s sprint14-progression-advanced.css
          test -s tests/sprint13-static.cjs
          test -s tests/sprint13-smoke.mjs
          test -s tests/sprint14-static.cjs
          test -s tests/sprint14-progression.cjs
          test -s tests/sprint14-smoke.mjs
          grep -q 'sprint14.html' index.html
          grep -q 'version: 13' sprint13-config.js
          grep -q 'OUTER FRONTIER 0.13' sprint13.html
          grep -q 'FRONTIER COMMAND 0.14' sprint14.html
          node --check sprint13-config.js
          node --check sprint13-source.js
          node --check sprint12-ui.js
          node --check sprint14-progression-core.js
          node --check sprint14-progression-advanced.js
          node --check sprint14-progression-ui.js
          node --check sprint14-progression-advanced-ui.js
          node --check tests/sprint13-smoke.mjs
          node --check tests/sprint14-smoke.mjs
          node tests/sprint13-static.cjs
          node tests/sprint14-static.cjs
          node tests/sprint14-progression.cjs

      - name: Install Chromium for browser validation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Outer Frontier 0.13 browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/sag13-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint13-smoke.mjs

      - name: Run Command Progression 0.14 browser regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/sag14-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint14-smoke.mjs

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='site' \
            ./ site/
          touch site/.nojekyll
          cat > site/build-info.json <<EOF
          {
            "release": "Command Progression 0.14",
            "source_branch": "live",
            "source_sha": "$(git rev-parse HEAD)",
            "deployed_from": "${GITHUB_SHA}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          test -s site/index.html
          test -s site/sprint13.html
          test -s site/sprint14.html
          test -s site/build-info.json

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy Command Progression 0.14 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
