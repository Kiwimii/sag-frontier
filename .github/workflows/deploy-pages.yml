# Deploy the protected browser runtime from the repository's single source branch.
name: Deploy SAG Frontier
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/check-web-runtime.mjs'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tools/check-web-runtime.mjs'
      - 'package.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate protected production build
        run: npm run check:web
      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='tools' \
            --exclude='release-manifest.json' \
            web/legacy-041/ site/
          touch site/.nojekyll
          cat > site/build-info.json <<EOF
          {"release":"SAG Kiwimi Depth 0.41.1","source_branch":"main","source_sha":"$(git rev-parse HEAD)","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          for file in site/index.html site/sprint41.html site/sprint41-kiwimi-depth.js site/sprint41-kiwimi-depth.css site/build-info.json; do test -s "$file"; done
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy SAG Kiwimi Depth 0.41.1
        id: deployment
        uses: actions/deploy-pages@v4
