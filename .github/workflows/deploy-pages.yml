# Deploy the stable 0.41 runtime plus the reviewed 0.42 progression and menu overlay.
name: Deploy SAG Frontier
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 0.42.1 release overlay
        run: |
          set -euo pipefail
          node --check web/release-042/sprint42-month.js
          node --check web/release-042/sprint42-menu.js
          test -s web/release-042/sprint42.html
          test -s web/release-042/sprint42-month.css
          test -s web/release-042/sprint42-menu.css
          grep -q 'sprint42.html?build=0421' web/legacy-041/index.html
          grep -q 'PRISM REGENT' web/release-042/sprint42-month.js
          grep -q 'ABYSSAL ORACLE' web/release-042/sprint42-month.js
          grep -q 'commander' web/release-042/sprint42-month.js
          grep -q 'Zentrales Menü' web/release-042/sprint42-menu.js
          grep -q 'Fenster schließen' web/release-042/sprint42-menu.js
      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a --exclude='.github' --exclude='tests' --exclude='tools' --exclude='release-manifest.json' --exclude='*.log' web/legacy-041/ site/
          rsync -a web/release-042/ site/
          touch site/.nojekyll
          cat > site/build-info.json <<EOF
          {"release":"SAG Month of the Frontier 0.42.1","source_branch":"main","source_sha":"$(git rev-parse HEAD)","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          for file in site/index.html site/sprint41.html site/sprint42.html site/sprint42-month.js site/sprint42-month.css site/sprint42-menu.js site/sprint42-menu.css site/build-info.json; do test -s "$file"; done
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy SAG Month of the Frontier 0.42.1
        id: deployment
        uses: actions/deploy-pages@v4
