# Deploy validated Kiwimi Depth 0.41 from live
name: Deploy SAG Kiwimi Depth 0.41
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-pages.yml']
  pull_request:
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout validated production branch
        uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate protected production build
        run: |
          set -euo pipefail
          for file in index.html sprint35.html sprint40.html sprint41.html sprint41-kiwimi-depth.js sprint41-kiwimi-depth.css tests/sprint41-static.cjs tests/sprint40-state.cjs tests/sprint35-static.cjs; do test -s "$file"; done
          node --check sprint41-kiwimi-depth.js
          node tests/sprint41-static.cjs
          node tests/sprint40-state.cjs
          node tests/sprint35-static.cjs
          grep -q 'sprint41.html?build=0410' index.html
      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='site' --exclude='sprint20-*.png' --exclude='sprint25-*.png' ./ site/
          touch site/.nojekyll
          cat > site/build-info.json <<EOF
          {"release":"SAG Kiwimi Depth 0.41","source_branch":"live","source_sha":"$(git rev-parse HEAD)","deployed_from":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          for file in site/index.html site/sprint41.html site/sprint41-kiwimi-depth.js site/sprint41-kiwimi-depth.css site/build-info.json; do test -s "$file"; done
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy SAG Kiwimi Depth 0.41
        id: deployment
        uses: actions/deploy-pages@v4
