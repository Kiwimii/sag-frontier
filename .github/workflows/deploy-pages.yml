name: Deploy Sprint 12 Browser Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Sprint 12 production branch
        uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Sprint 12 production files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s launch.html
          test -s sprint12.html
          test -s sprint12.bundle.css
          test -s sprint12-config.js
          test -s sprint12-source.js
          test -s sprint12-ui.js
          test -s tests/sprint12-static.cjs
          test -s tests/sprint12-smoke.mjs
          grep -q 'sprint12.html' index.html
          grep -q 'version: 12' sprint12-config.js
          grep -q 'MODULAR DEEP SPACE 0.12' sprint12.html
          node --check sprint12-config.js
          node --check sprint12-source.js
          node --check sprint12-ui.js
          node tests/sprint12-static.cjs

      - name: Install Chromium for browser validation
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Sprint 12 browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/sag12-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint12-smoke.mjs

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='site' \
            ./ site/
          touch site/.nojekyll
          test -s site/index.html
          test -s site/sprint12.html

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy Sprint 12 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
