name: Deploy Playable Browser Build

# Republishes the current browser build whenever the game or this workflow changes.
on:
  push:
    branches:
      - main
    paths:
      - 'godot/**'
      - '.github/workflows/deploy-pages.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.6.3
      GODOT_STATUS: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATE_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          RELEASE_BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl --fail --location --retry 3 "${RELEASE_BASE}/${GODOT_FILE}" --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "${RELEASE_BASE}/${TEMPLATE_FILE}" --output /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          godot --version

      - name: Import project
        run: godot --headless --path godot --editor --quit-after 2

      - name: Run headless smoke test
        run: godot --headless --path godot --quit-after 10

      - name: Export game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          godot --headless --path godot --export-release Web "$GITHUB_WORKSPACE/site/index.html"
          test -s site/index.html
          test -s site/index.wasm
          test -s site/index.pck
          touch site/.nojekyll

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
