# Deploy the validated Stability Operations 0.40 from the live branch
name: Deploy SAG Stability Operations 0.40
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-pages.yml']
  pull_request:
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-production
  cancel-in-progress: true
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout validated production branch
        uses: actions/checkout@v4
        with:
          ref: live
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate protected production build
        run: |
          set -euo pipefail
          for file in index.html launch.html sprint25.html sprint35.html sprint40.html sprint35-galia-core.js sprint35-galia-ui.js sprint35-galia.css sprint36-save-integrity.js sprint37-action-safety.js sprint38-ship-services.js sprint39-accessibility.js sprint40-operations-polish.js sprint40-stability.css tests/sprint25-static.cjs tests/sprint35-static.cjs tests/sprint40-state.cjs tests/sprint40-smoke.mjs; do test -s "$file"; done
          for file in sprint35-galia-core.js sprint35-galia-ui.js sprint36-save-integrity.js sprint37-action-safety.js sprint38-ship-services.js sprint39-accessibility.js sprint40-operations-polish.js tests/sprint40-state.cjs tests/sprint40-smoke.mjs; do node --check "$file"; done
          grep -q 'sprint40.html?build=0400' index.html
          grep -q 'sprint35.html?build=0400' sprint40.html
          node tests/sprint25-static.cjs
          node tests/sprint35-static.cjs
          node tests/sprint40-state.cjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run protected production browser regression
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/sag40-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint40-smoke.mjs
      - name: Assemble GitHub Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='site' --exclude='sprint20-*.png' --exclude='sprint25-*.png' ./ site/
          touch site/.nojekyll
          cat > site/build-info.json <<EOF
          {"release":"SAG Stability Operations 0.40","source_branch":"live","source_sha":"$(git rev-parse HEAD)","deployed_from":"${GITHUB_SHA}","built_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)"}
          EOF
          for file in site/index.html site/sprint35.html site/sprint40.html site/sprint36-save-integrity.js site/sprint37-action-safety.js site/sprint38-ship-services.js site/sprint39-accessibility.js site/sprint40-operations-polish.js site/sprint40-stability.css site/build-info.json; do test -s "$file"; done
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate-and-build
    steps:
      - name: Deploy SAG Stability Operations 0.40
        id: deployment
        uses: actions/deploy-pages@v4