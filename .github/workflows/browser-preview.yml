name: Browser Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'godot/**'
      - '.github/workflows/browser-preview.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/browser-preview.yml'

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.6.3
      GODOT_STATUS: stable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATE_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          RELEASE_BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"

          curl --fail --location --retry 3 "${RELEASE_BASE}/${GODOT_FILE}" --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot

          curl --fail --location --retry 3 "${RELEASE_BASE}/${TEMPLATE_FILE}" --output /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"

          godot --version

      - name: Import project
        run: godot --headless --path godot --editor --quit-after 2

      - name: Export browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p browser-preview
          godot --headless --path godot --export-release Web "$GITHUB_WORKSPACE/browser-preview/index.html"
          test -s browser-preview/index.html
          test -s browser-preview/index.wasm
          test -s browser-preview/index.pck
          touch browser-preview/.nojekyll

      - name: Add preview landing metadata
        shell: bash
        run: |
          cat > browser-preview/build-info.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload browser build
        uses: actions/upload-artifact@v4
        with:
          name: sag-frontier-browser-preview
          path: browser-preview/
          if-no-files-found: error
          retention-days: 14
