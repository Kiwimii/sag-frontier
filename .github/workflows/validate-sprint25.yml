name: Validate Galia Narrative 0.25

on:
  pull_request:
    branches:
      - live
    paths:
      - 'sprint21-*'
      - 'sprint22-*'
      - 'sprint23-*'
      - 'sprint24-*'
      - 'sprint25*'
      - 'tests/sprint25-*'
      - '.github/workflows/validate-sprint25.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout narrative build
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate narrative architecture and continuity
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            sprint21-canon-lore.js \
            sprint22-sag-dac.js \
            sprint23-campaign-narrative.js \
            sprint24-kiwimi-dialogue.js \
            sprint25-narrative-ui.js \
            sprint25-finale-editorial.js \
            tests/sprint25-story.cjs \
            tests/sprint25-static.cjs \
            tests/sprint25-smoke.mjs; do
              test -s "$file"
              node --check "$file"
          done
          test -s sprint24-kiwimi-dialogue.css
          test -s sprint25-narrative.css
          test -s sprint25.html
          node tests/sprint13-static.cjs
          node tests/sprint14-static.cjs
          node tests/sprint14-progression.cjs
          node tests/sprint19-static.cjs
          node tests/sprint19-story.cjs
          node tests/sprint20-static.cjs
          node tests/sprint25-static.cjs
          node tests/sprint25-story.cjs

  legacy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout narrative build
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run existing browser regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/sag25-legacy-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint13-smoke.mjs
          node tests/sprint14-smoke.mjs
          node tests/sprint19-smoke.mjs
          node tests/sprint20-smoke.mjs

  narrative-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout narrative build
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run narrative and dialogue browser test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > /tmp/sag25-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint25-smoke.mjs
      - name: Upload narrative screenshots
        uses: actions/upload-artifact@v4
        with:
          name: sprint25-narrative-screenshots
          path: |
            sprint25-desktop-lore.png
            sprint25-mobile-profile.png
          if-no-files-found: error
