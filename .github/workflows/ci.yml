name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate source
        run: npm run check

      - name: Build plugin
        run: npm run build

      - name: Upload plugin archive
        uses: actions/upload-artifact@v4
        with:
          name: sag-voidrunner-plugin
          path: dist/sag-voidrunner.zip
