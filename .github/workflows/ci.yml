name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate source and export wiring
        run: npm run check

      - name: Verify Godot project files exist
        run: |
          test -f godot/project.godot
          test -f godot/scenes/main.tscn
          test -f godot/export_presets.cfg

  package-source:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source snapshot
        run: zip -qr sag-frontier-source.zip godot wordpress docs tools package.json README.md ROADMAP.md

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sag-frontier-source
          path: sag-frontier-source.zip
