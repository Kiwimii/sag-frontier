name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3
      GODOT_STATUS: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate source and export wiring
        run: npm run check

      - name: Verify Godot project files exist
        run: |
          test -f godot/project.godot
          test -f godot/scenes/main.tscn
          test -f godot/export_presets.cfg
          test -f godot/tests/test_full_flow.gd

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATE_FILE="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          RELEASE_BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          curl --fail --location --retry 3 "${RELEASE_BASE}/${GODOT_FILE}" --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          curl --fail --location --retry 3 "${RELEASE_BASE}/${TEMPLATE_FILE}" --output /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
          godot --version

      - name: Import project and reject script errors
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path godot --editor --quit-after 2 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported a script load error."
            exit 1
          fi

      - name: Run deterministic full-flow test
        run: godot --headless --path godot --script res://tests/test_full_flow.gd

      - name: Export browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sag-web
          godot --headless --path godot --export-release Web /tmp/sag-web/index.html 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/godot-export.log; then
            echo "Godot reported a script error during export."
            exit 1
          fi
          test -s /tmp/sag-web/index.html
          test -s /tmp/sag-web/index.wasm
          test -s /tmp/sag-web/index.pck

  package-source:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source snapshot
        run: zip -qr sag-frontier-source.zip godot wordpress docs tools package.json README.md ROADMAP.md

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: sag-frontier-source
          path: sag-frontier-source.zip
