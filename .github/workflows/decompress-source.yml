name: Build and test Sprint 07
on:
  push:
    branches: [feat/live-sprint-07-progression]
  pull_request:
    branches: [live]
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Sprint 05 source
        run: |
          test -s sprint05-source.js
          echo "Runtime source: $(wc -c < sprint05-source.js) bytes"
      - name: Repair build source
        run: node tools/repair-build-sprint07.cjs
      - name: Build Sprint 07 source
        run: |
          rm -f sprint07-build.failed sprint07-build.log
          node tools/build-sprint07.cjs > sprint07-build.log 2>&1 || touch sprint07-build.failed
          cat sprint07-build.log
      - name: Make branding title version-aware
        if: ${{ !hashFiles('sprint07-build.failed') }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'sprint06-branding.js';
          let source = fs.readFileSync(file, 'utf8');
          source = source.replace("const VERSION_TITLE = 'S.A.G. FRONTIER // KIWIMI PROTOCOL 0.6';", "const VERSION_TITLE = document.body?.dataset.versionTitle || 'S.A.G. FRONTIER // KIWIMI PROTOCOL 0.6';");
          fs.writeFileSync(file, source);
          NODE
      - name: Validate JavaScript
        if: ${{ !hashFiles('sprint07-build.failed') }}
        run: |
          node --check sprint07-source.js
          node --check sprint06-branding.js
          node --check sprint07-branding.js
          node --check tests/sprint07-smoke.mjs
      - name: Install browser test runtime
        if: ${{ !hashFiles('sprint07-build.failed') }}
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        if: ${{ !hashFiles('sprint07-build.failed') }}
        run: |
          python3 -m http.server 4173 > /tmp/sag-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          set +e
          node tests/sprint07-smoke.mjs > sprint07-smoke.log 2>&1
          TEST_EXIT=$?
          set -e
          cat sprint07-smoke.log
          exit $TEST_EXIT
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint07-build-diagnostics
          path: |
            sprint07-build.log
            sprint07-build.failed
            sprint07-smoke.log
            sprint07-source.js
            /tmp/sag-http.log
          if-no-files-found: ignore
      - name: Commit generated runtime
        if: github.event_name == 'push' && !hashFiles('sprint07-build.failed')
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/build-sprint07.cjs sprint07-build.log sprint07-source.js sprint06-branding.js
          git diff --cached --quiet && exit 0
          git commit -m 'build: generate Sprint 0.7 runtime'
          git push origin HEAD:feat/live-sprint-07-progression
      - name: Fail on build diagnostics
        run: test ! -f sprint07-build.failed
