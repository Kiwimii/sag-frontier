name: Build and test Sprint 09
on:
  push:
    branches: [feat/live-sprint-09-frontier-path]
  pull_request:
    branches: [live]
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Frontier Path runtime
        run: |
          node tools/build-sprint09-progression.cjs
          node tools/fix-sprint09-runtime.cjs
      - name: Validate JavaScript
        run: |
          node --check sprint09-source.js
          node --check sprint09-branding.js
          node --check tools/build-sprint09-progression.cjs
          node --check tools/fix-sprint09-runtime.cjs
          node --check tests/sprint09-smoke.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 > /tmp/sag-sprint09-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node tests/sprint09-smoke.mjs | tee sprint09-smoke.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint09-diagnostics
          path: |
            sprint09-source.js
            sprint09-smoke.log
            /tmp/sag-sprint09-http.log
          if-no-files-found: ignore
      - name: Commit generated runtime
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sprint09-source.js
          git diff --cached --quiet && exit 0
          git commit -m 'build: generate Frontier Path 0.9 runtime'
          git push origin HEAD:feat/live-sprint-09-frontier-path
