<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>S.A.G. Frontier</title><style>html,body{margin:0;background:#030711;color:#e8f7ff;font-family:system-ui;height:100%;display:grid;place-items:center}</style></head><body><div id="status">Loading S.A.G. Frontier…</div><script>fetch('index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Build not found');return r.text()}).then(t=>{const fixed=t.replace('if(d<m){M=d;t=e}','if(d<m){m=d;t=e}');document.open();document.write(fixed);document.close()}).catch(e=>{document.getElementById('status').textContent='Unable to load game: '+e.message})</script></body></html>
